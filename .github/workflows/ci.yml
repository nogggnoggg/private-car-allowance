name: CI

on:
  push:
    branches:
      - phase-001
      - main
  pull_request:
    branches:
      - phase-001
      - main

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: lint + typecheck + frontend tests + frontend build
  # No database required.
  # ────────────────────────────────────────────────────────────────────
  lint-typecheck-frontend:
    name: Lint / Typecheck / Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --engine-strict=false: @testing-library/jest-dom@7 declares engines.node>=22
        # but is fully functional on Node 20; the declaration is overly conservative.
        run: npm ci --engine-strict=false

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests (Vitest / jsdom)
        run: npm run test --workspace=frontend

      - name: Frontend build (Vite)
        run: npm run build --workspace=frontend

  # ────────────────────────────────────────────────────────────────────
  # Job 2: backend build + backend tests (unit + integration)
  # Requires Postgres service container for integration tests.
  # ────────────────────────────────────────────────────────────────────
  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --engine-strict=false: @testing-library/jest-dom@7 declares engines.node>=22
        # but is fully functional on Node 20; the declaration is overly conservative.
        run: npm ci --engine-strict=false

      - name: Install Playwright Chromium (headless shell)
        # Mirrors backend/Dockerfile's `npx playwright install --only-shell chromium`
        # (PHASE-008-T7b): backend's phase8-pdf-render.test.ts / phase8-report-print.test.ts
        # launch a real headless-shell browser. --with-deps also installs the OS-level
        # dependencies the ubuntu-latest runner doesn't ship by default.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Backend build (prisma generate + tsc)
        run: npm run build --workspace=backend

      - name: Run Prisma migrations
        working-directory: backend
        run: npm run migrate:deploy

      - name: Backend tests (unit + integration)
        run: npm run test --workspace=backend

  # ────────────────────────────────────────────────────────────────────
  # Job 3: docker build
  # Validates both Dockerfiles can be built.
  # BuildKit is available by default on ubuntu-latest (Linux).
  # ────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t frontend:ci .

      # ──────────────────────────────────────────────────────────────────
      # PHASE-004-R9 regression guard: `npm run seed:admin` (the documented
      # way to create the system's first ADMIN, docs/specs/PHASE-002.md
      # §13.1-1) must resolve and run inside the *built runtime image* —
      # not just in dev/CI checkouts where backend/src is present. The
      # original defect (backend/package.json pointing seed:admin at
      # `tsx src/seed/seed-admin.ts`, while the runtime image intentionally
      # ships only `dist/`, never `src/`) surfaced ONLY against a real
      # image and was invisible to the "Backend Build & Tests" job above,
      # which runs straight from the checkout.
      #
      # No Postgres is wired into this job, so we don't attempt a full
      # end-to-end seed here (that is verified manually against a real
      # docker-compose stack as part of the PHASE-004-R9 task evidence).
      # Instead we override the image's ENTRYPOINT (which otherwise runs
      # `prisma migrate deploy` unconditionally and would fail on a missing
      # DATABASE_URL before ever reaching npm) and invoke `npm run
      # seed:admin` directly with no env vars set. seed-admin.ts validates
      # SEED_ADMIN_LOGIN/SEED_ADMIN_PASSWORD *before* touching Prisma/the
      # DB, so this deterministically reaches the script's own
      # parameter-validation output without any database — while still
      # exercising real module resolution inside the built image. This
      # is precisely where the original defect (ERR_MODULE_NOT_FOUND) hit.
      - name: Verify seed:admin resolves inside built backend image
        run: |
          set +e
          OUTPUT=$(docker run --rm --entrypoint npm backend:ci run seed:admin 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "ERR_MODULE_NOT_FOUND"; then
            echo "::error::seed:admin cannot resolve its module inside the built runtime image (regression of PHASE-004-R9 — the image must not require backend/src)."
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "SEED_ADMIN_LOGIN environment variable is required"; then
            echo "::error::seed:admin did not reach its own parameter-validation output; unexpected failure mode (see log above)."
            exit 1
          fi
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::seed:admin exited with status $STATUS, expected 1 (missing required env vars)."
            exit 1
          fi
          echo "OK: seed:admin resolves and runs correctly inside the built image."
